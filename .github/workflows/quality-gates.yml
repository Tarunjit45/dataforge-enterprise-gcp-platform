name: Quality Gates & Compliance Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  assert_quality_gates:
    name: Assert DevSecOps Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: "Stage 1: Checkout Code"
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Test Dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: "Quality Gate 1, 2, 3: Unit Tests, Integration Tests & 85% Coverage Threshold"
        run: |
          pytest --cov=src --cov-fail-under=85 tests/

      - name: "Quality Gate 4: Zero High/Critical Security Vulnerabilities"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          config: devsecops/trivy/trivy.yaml

      - name: "Quality Gate 5: Infrastructure Code Security & Validation Check"
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          config_file: devsecops/tfsec/tfsec.yaml
