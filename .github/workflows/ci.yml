name: CI - Continuous Integration Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint_and_test:
    name: Lint, Test & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: "Stage 1: Checkout Code"
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: "Stage 2: Dependency Installation"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: "Stage 3: Python Linting"
        run: |
          flake8 src/ tests/ --max-line-length=120 --ignore=E203,W503
          black --check src/ tests/
          isort --check-only src/ tests/

      - name: "Stage 4, 5, 6: Testing & 85% Code Coverage Gate"
        run: |
          pytest --cov=src --cov-fail-under=85 tests/

  security_scans:
    name: DevSecOps Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: "Stage 1: Checkout Code"
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "Stage 9A: Bandit SAST Scan"
        run: |
          pip install bandit
          bandit -c devsecops/bandit/bandit.yaml -r src/

      - name: "Stage 9B: Semgrep SAST Scan"
        uses: semgrep/semgrep-action@v1
        with:
          config: devsecops/semgrep/semgrep.yaml

      - name: "Stage 9C: Trivy Vulnerability & Secret Scan"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          config: devsecops/trivy/trivy.yaml

      - name: "Stage 9D: tfsec IaC Security Scan"
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          config_file: devsecops/tfsec/tfsec.yaml

  build_artifacts:
    name: Build & Package Release Artifacts
    needs: [lint_and_test, security_scans]
    runs-on: ubuntu-latest
    steps:
      - name: "Stage 1: Checkout Code"
        uses: actions/checkout@v4

      - name: "Stage 10: Build Artifacts"
        run: |
          bash scripts/build.sh
          bash scripts/package.sh dev 1.0.0

      - name: "Stage 11: Upload Build Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-package
          path: release_artifacts/
